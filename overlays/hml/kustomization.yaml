apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente de homologacao: usado apenas no Incidente D do Exercicio 9.
# TODO(aluno, Incidente D): troque cicd-hml pelo seu projeto de homologacao ($HML_NS).
namespace: cicd-hml-aluno13

resources:
  - ../../base

# Como em producao, a imagem NAO e construida aqui: e a mesma imagem de dev, por digest.
# TODO(aluno, Incidente D): em newName, troque cicd-dev pelo seu projeto de DESENVOLVIMENTO ($DEV_NS).
# O digest e a versao sao copiados de dev por: bash scripts/promover.sh hml
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-aluno13/luz-bairro
    digest: sha256:2006623df8128fca3a5fe298f131c10e14e874ca5ff9000a369e98472436404a

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - HOMOLOGACAO
      - APP_ENV=hml
      - APP_VERSION=df642b5
